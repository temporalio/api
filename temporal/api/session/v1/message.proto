syntax = "proto3";

package temporal.api.session.v1;

option go_package = "go.temporal.io/api/session/v1;session";
option java_package = "io.temporal.api.session.v1";
option java_multiple_files = true;
option java_outer_classname = "MessageProto";
option ruby_package = "Temporalio::Api::Session::V1";
option csharp_namespace = "Temporalio.Api.Session.V1";

import "google/protobuf/empty.proto";

// EXPERIMENTAL. Subject to redesign or removal.
// Sent on workflow and activity polls. Presence means this worker can serve
// sessions, where the current implementation of sessions = sticky activities.
message WorkerSessionOptions {
    // Admission control, if unset the worker accepts an arbitrary number of
    // sessions (bounded by session slots in the future)
    oneof admission {
        // The expectation is that this is set for the AgentCore use case.
        // SDK-side, if this is specified, the worker *only* sticky polls.
        SingleSessionOptions single_session = 1;
    }
}

// EXPERIMENTAL. Subject to redesign or removal.
// Serve exactly one workflow for the worker's lifetime, including across
// process restarts with the same stable_identity. The server binds the worker
// to the first workflow task it hands out, and dispatches no other work here,
// even after that workflow completes.
message SingleSessionOptions {
    // Identity the binding is stored under. Reuse it across restarts of the
    // same session, not across concurrently running workers.
    //
    // Note: this effectively acts as a configurable sticky queue.
    // Note: we are currently unsure how this will evolve. May be deprecated as
    // the session model develops.
    string stable_identity = 1;
}

// EXPERIMENTAL. Subject to redesign or removal.
// Resolved activity placement. Unset = normal task-queue routing.
// workflow_session requires the activity's task queue to be the workflow's,
// and the workflow's worker to serve sessions.
message ActivitySessionOptions {
    oneof placement {
        // Run on the workflow's current worker (its sticky queue).
        google.protobuf.Empty workflow_session = 1;

        // Future: string stable_identity = 2; (target a named worker)
    }
}
