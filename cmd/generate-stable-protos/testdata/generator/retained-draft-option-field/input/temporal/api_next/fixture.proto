syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";
import "google/protobuf/descriptor.proto";

message Labels {
  string preview = 1 [(temporal.api.protometa.v1.draft) = "preview"];
}
extend google.protobuf.MessageOptions {
  Labels labels = 50000;
}
message Stored {
  option (labels) = { preview: "on" };
}
