syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";
import "temporal/api_next/used.proto";
import "temporal/api_next/unused.proto";
import public /* before */ 'temporal/api_next/reexported.proto' /* after */;
import "google/protobuf/any.proto";
import "temporal/api_n" /* internal comment */ "ext/split.proto";
option java_package = "temporal/api_next/used.proto";
// Keep the literal "temporal/api_next/used.proto" in comments and options.
// import "temporal/api_next/used.proto";
message Root {
  Used stable = 1 [json_name = "temporal/api_next/used.proto"];
  Unused draft = 2 [(temporal.api.protometa.v1.draft) = "feature-a"];
  google.protobuf.Any any = 3;
  Split split = 4;
}
