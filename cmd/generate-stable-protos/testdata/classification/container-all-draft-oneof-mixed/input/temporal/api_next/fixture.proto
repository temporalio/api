syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";
message Draft {
  option (temporal.api.protometa.v1.draft_message) = "preview";
}
message Choice {
  oneof selection {
    string name = 1 [(temporal.api.protometa.v1.draft) = "preview"];
    Draft target = 2;
  }
}
