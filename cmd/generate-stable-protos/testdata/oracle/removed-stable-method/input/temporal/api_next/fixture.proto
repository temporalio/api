syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";

// Request starts the preview call.
message Request { option (temporal.api.protometa.v1.draft_message) = "preview"; }
// Response reports the preview result.
message Response { option (temporal.api.protometa.v1.draft_message) = "preview"; }
message StableRequest {}
message StableResponse {}
// Service provides both stable and preview calls.
service Service {
  // Call invokes the preview behavior.
  rpc Call(Request) returns (Response) {
    // This option applies only to Call.
    option (temporal.api.protometa.v1.draft_method) = "preview";
  }
  // Stable invokes the stable behavior.
  rpc Stable(StableRequest) returns (StableResponse);
}
