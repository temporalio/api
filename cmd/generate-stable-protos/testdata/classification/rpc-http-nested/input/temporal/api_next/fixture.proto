syntax = "proto3";
package fixture;
import "google/api/annotations.proto";
import "temporal/api_next/protometa/v1/draft.proto";
message Request { Draft item = 1 [(temporal.api.protometa.v1.draft) = "feature-a"]; }
message Draft {
  option (temporal.api.protometa.v1.draft_message) = "feature-a";
  string id = 1;
}
message Response {}
service Service {
  rpc Call (Request) returns (Response) {
    option (google.api.http) = { get: "/items/{item.id}" };
  }
}
