version: 0.14.0

profiles:
  testx: off

go-modules:
  cmd/protoc-gen-nexus-rpc-yaml: on
  cmd/protoc-gen-resource-id-lint: on
  cmd/protoc-gen-system-nexus-wit: on

format:
  # Existing .proto files use 4-space indentation; turn on once formatted.
  buf-format: off
  go: off

lint:
  actionlint: on
  api-linter:
    command: api-linter
    files:
      - "temporal/**/*.proto"
    check: ["--set-exit-status", "-I=.", "--config=api-linter.yaml"]
  buf-lint: on
  go:
    gofix: off
    golangci-lint: off
    gomodtidy: on
