syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";
import "temporal/api_next/types.proto";
message Parent {
  string stable = 1;
  Draft single = 2 [(temporal.api.protometa.v1.draft) = "feature-a"];
  repeated Draft list = 3 [(temporal.api.protometa.v1.draft) = "feature-a"];
  map<string, Draft> by_name = 4 [(temporal.api.protometa.v1.draft) = "feature-a"];
  oneof choice {
    Draft draft = 5 [(temporal.api.protometa.v1.draft) = "feature-a"];
    string stable_choice = 6;
  }
  Draft.Nested nested = 9 [(temporal.api.protometa.v1.draft) = "feature-a"];
  Draft.State state = 10 [(temporal.api.protometa.v1.draft) = "feature-a"];
  Draft.Extra extra = 11 [(temporal.api.protometa.v1.draft) = "feature-a"];
  StableChild stable_child = 12;
  repeated Draft.State states = 13 [(temporal.api.protometa.v1.draft) = "feature-a"];
  map<string, Draft.State> state_by_name = 14 [(temporal.api.protometa.v1.draft) = "feature-a"];
}
message Empty { Draft draft = 1 [(temporal.api.protometa.v1.draft) = "feature-a"]; }
message CycleA { CycleB child = 1; }
message CycleB { CycleA next = 1; Draft draft = 2 [(temporal.api.protometa.v1.draft) = "feature-a"]; }
