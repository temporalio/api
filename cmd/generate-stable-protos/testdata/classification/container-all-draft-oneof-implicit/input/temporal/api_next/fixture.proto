syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";
message Draft {
  option (temporal.api.protometa.v1.draft_message) = "preview";
  message Nested {}
}
enum Mode { option (temporal.api.protometa.v1.draft_enum) = "preview"; ZERO = 0; }
message Choice {
  oneof selection {
    Draft.Nested target = 1;
    Mode mode = 2;
  }
}
