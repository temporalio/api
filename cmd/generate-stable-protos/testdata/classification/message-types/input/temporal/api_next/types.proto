syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";
message Draft {
  option (temporal.api.protometa.v1.draft_message) = "feature-a";
  string value = 1;
  message Nested { string value = 1; }
  enum State { STATE_UNSPECIFIED = 0; STATE_READY = 1; }
  message Extra {
    option (temporal.api.protometa.v1.draft_message) = "feature-b";
    string value = 1;
  }
}
message StableChild {
  string stable = 1;
  Draft draft = 2;
}
