syntax = "proto3";
package fixture;
import "google/api/annotations.proto";
import "temporal/api_next/protometa/v1/draft.proto";
message Request { oneof selection { option (temporal.api.protometa.v1.draft_oneof) = "preview"; string draft_id = 1; } }
message Response {}
service Service {
  rpc Call (Request) returns (Response) {
    option (google.api.http) = { get: "/items/{draft_id=items/*}" };
  }
}
