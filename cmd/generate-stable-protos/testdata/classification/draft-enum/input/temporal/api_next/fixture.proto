syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";

// Mode is available in preview.
enum Mode {
  option (temporal.api.protometa.v1.draft_enum) = "preview";
  // ZERO is the default preview mode.
  ZERO = 0;
} // This enum is preview-only.

message Config {
  // mode selects a preview mode.
  Mode mode = 1 [(temporal.api.protometa.v1.draft) = "preview"];
  repeated Mode ordered_modes = 2 [(temporal.api.protometa.v1.draft) = "preview"];
  map<string, Mode> modes = 3 [(temporal.api.protometa.v1.draft) = "preview"]; // This lookup is preview-only.
  optional NestedMode nested_mode = 4 [(temporal.api.protometa.v1.draft) = "nested-preview"];
  map<string, NestedMode> nested_modes = 5 [(temporal.api.protometa.v1.draft) = "nested-preview"];
  // name identifies the config.
  string name = 6;

  // NestedMode is scoped to Config.
  enum NestedMode {
    option (temporal.api.protometa.v1.draft_enum) = "nested-preview";
    NESTED_MODE_UNSPECIFIED = 0;
  }
}
