syntax = "proto3";
package fixture;
import "google/api/annotations.proto";
import "temporal/api_next/protometa/v1/draft.proto";
message Request { Payload payload = 1 [(temporal.api.protometa.v1.draft) = "feature-a"]; }
message Payload { string name = 1; }
message Response {}
service Service {
  rpc Call (Request) returns (Response) {
    option (google.api.http) = { post: "/items" body: "payload" };
  }
}
