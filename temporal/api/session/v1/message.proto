syntax = "proto3";

package temporal.api.session.v1;

option go_package = "go.temporal.io/api/session/v1;session";
option java_package = "io.temporal.api.session.v1";
option java_multiple_files = true;
option java_outer_classname = "MessageProto";
option ruby_package = "Temporalio::Api::Session::V1";
option csharp_namespace = "Temporalio.Api.Session.V1";

import "google/protobuf/empty.proto";

// EXPERIMENTAL. Subject to redesign or removal.
// Sent on workflow and activity polls. Presence means this worker can serve
// sessions. Currently, the only supported Session type is Workflow Session
// (aka Workflow-as-Session). A Workflow that is bound to a worker serving sessions
// can receive both workflow tasks and activity tasks of an execution.
//
// The server routes a session's work to the worker's sticky queue, so the
// sticky queue name depends on the admission mode:
//   * single_session: the worker polls only its sticky queue, named after
//     SingleSessionOptions.stable_identity.
//   * multi_session: the worker polls the normal queue and its sticky queue,
//     named after the poll's worker_instance_key.
// The server rejects sticky polls whose name does not follow this rule.
message WorkerSessionOptions {
    // Admission control. Required: exactly one mode must be set, and the
    // server rejects session options with neither.
    oneof admission {
        // If specified, the worker only polls for work belonging to its session.
        SingleSessionOptions single_session = 1;
        // If specified, the worker can serve multiple sessions at once.
        MultiSessionOptions multi_session = 2;
    }
}

// EXPERIMENTAL. Subject to redesign or removal.
// Serve exactly one session for the worker's lifetime, including across
// process restarts with the same stable_identity. The server binds the worker
// to the first session that needs a worker, and dispatches no other work here,
// even after that session completes.
message SingleSessionOptions {
    // Identity the binding is stored under. Required; must be non-empty.
    // Reuse it across restarts of the same session, not across concurrently
    // running workers. If multiple workers poll with the same stable_identity
    // concurrently, the server treats them as pollers of a single worker and
    // process affinity is lost.
    //
    // Note: this effectively acts as a configurable sticky queue.
    // Note: we are currently unsure how this will evolve. May be deprecated as
    // the session model develops.
    string stable_identity = 1;
}

// EXPERIMENTAL. Subject to redesign or removal.
// Serve any number of sessions concurrently. Future admission knobs (e.g.
// session slots) belong here.
message MultiSessionOptions {
}

// EXPERIMENTAL. Subject to redesign or removal.
// Resolved activity placement. Unset = normal task-queue routing.
message ActivitySessionOptions {
    oneof placement {
        // Run in the workflow's current session (on its sticky queue).
        // Currently requires the activity's task queue to be the workflow's,
        // and the workflow's worker to serve sessions.
        google.protobuf.Empty workflow_session = 1;

        // Future: references to other types of sessions.
    }
}

// EXPERIMENTAL. Subject to redesign or removal.
// How a workflow is bound to a worker, recorded on history events so the
// server can rebuild the binding from history (for example on reset). See
// session_info on WorkflowTaskStartedEventAttributes and inherited_session_info
// on WorkflowExecutionStartedEventAttributes:
//   * unset: not bound (started by a worker without sessions).
//   * {}: bound to a multi-session worker.
//   * {exclusive_worker: true}: bound to a single-session worker.
// The worker's queue is the sticky task queue of the workflow task's scheduled
// event. Not a worker or user option; SDKs should not read or interpret it.
message SessionInfo {
    // True when the workflow is bound to a single-session worker. Such a
    // binding never moves to another worker.
    bool exclusive_worker = 1;
}
