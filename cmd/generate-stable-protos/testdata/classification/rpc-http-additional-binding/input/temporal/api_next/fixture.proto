syntax = "proto3";
package fixture;
import "google/api/annotations.proto";
import "temporal/api_next/protometa/v1/draft.proto";
message Request { Item item = 1; }
message Item { string draft_id = 1 [(temporal.api.protometa.v1.draft) = "feature-a"]; }
message Response {}
service Service {
  rpc Call (Request) returns (Response) {
    option (google.api.http) = {
      get: "/item"
      additional_bindings { custom { kind: "REPORT" path: "/items/{item.draft_id}" } }
    };
  }
}
