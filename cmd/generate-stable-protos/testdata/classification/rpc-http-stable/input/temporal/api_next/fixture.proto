syntax = "proto3";
package fixture;
import "google/api/annotations.proto";
import "temporal/api_next/protometa/v1/draft.proto";
message Request {
  Item item = 1;
  string draft_result = 2 [(temporal.api.protometa.v1.draft) = "feature-a"];
}
message Item { string id = 1; }
message Response { string draft_result = 1; }
service Service {
  rpc Call (Request) returns (Response) {
    option (google.api.http) = {
      get: "/items/{item.id}"
      response_body: "draft_result"
      additional_bindings { post: "/items" body: "item" }
    };
  }
}
