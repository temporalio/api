syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";

// Mode controls behavior.
enum Mode {
  option allow_alias = true;
  ZERO = 0;
  // PREVIEW opts in to the new behavior.
  PREVIEW = 2 [(temporal.api.protometa.v1.draft_enum_value) = "preview"]; STABLE = 1; // This stable value remains.
  ALIAS = 1;
}
message Config {
  Mode mode = 1;

  enum NestedMode {
    NESTED_MODE_UNSPECIFIED = 0;
    // NESTED_MODE_PREVIEW is a draft option.
    NESTED_MODE_PREVIEW = 1 [(temporal.api.protometa.v1.draft_enum_value) = "preview"]; // This nested value is draft.
  }
  NestedMode nested_mode = 2;
}
