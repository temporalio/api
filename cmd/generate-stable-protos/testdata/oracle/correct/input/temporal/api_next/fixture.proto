syntax = "proto3";

package fixture;

import "temporal/api_next/protometa/v1/draft.proto";

// Stable doc.
message Example {
  string stable = 1;
  // DRAFT leading a
  string a = 2 [(temporal.api.protometa.v1.draft) = "feature-a"];
  StableChild stable_child = 3; // trailing stable_child
  Draft draft = 4;
}

message StableChild {
  string value = 1;
}

// DRAFT leading comment of draft message.
message Draft {
  option (temporal.api.protometa.v1.draft_message) = "feature-b";
  string value = 1;
}
