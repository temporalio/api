version: v2
modules:
  - path: .
    name: buf.build/temporalio/api
    excludes:
      # Vendored for api-linter (can't read the BSR); excluded so buf sees them once.
      - google
      - nexusannotations
deps:
  - buf.build/googleapis/googleapis
  - buf.build/temporalio/nexus-annotations
lint:
  use:
    - STANDARD
  ignore:
    - cmd
    - google
  ignore_only:
    # Nexus operation outputs aren't necessarily messages defined for the operation. ActivityService.GetResult outputs
    # the activity's result payload.
    RPC_RESPONSE_STANDARD_NAME:
      - temporal/api/activityservice/v1/service.proto
  disallow_comment_ignores: true
breaking:
  use:
    - WIRE_JSON
  ignore:
    - google
