syntax = "proto3";
package fixture;

import "google/protobuf/descriptor.proto";
enum Mode {
  STABLE = 0;
}

message Labels {
  Mode mode = 1;
}

extend google.protobuf.MessageOptions {
  Mode mode = 50000;
  Labels labels = 50001;
}

message Stored {
  option (mode) = STABLE;
  option (labels) = {mode: STABLE};
}
