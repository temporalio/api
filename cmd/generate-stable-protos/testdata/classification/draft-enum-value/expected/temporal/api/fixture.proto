syntax = "proto3";
package fixture;

// Mode controls behavior.
enum Mode {
  option allow_alias = true;
  ZERO = 0;
  STABLE = 1; // This stable value remains.
  ALIAS = 1;
}

message Config {
  Mode mode = 1;

  enum NestedMode {
    NESTED_MODE_UNSPECIFIED = 0;
  }
  NestedMode nested_mode = 2;
}
