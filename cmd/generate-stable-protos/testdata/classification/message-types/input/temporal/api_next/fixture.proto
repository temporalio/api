syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";
import "temporal/api_next/types.proto";
message Parent {
  string stable = 1;
  Draft single = 2;
  repeated Draft list = 3;
  map<string, Draft> by_name = 4;
  oneof choice {
    Draft draft = 5;
    string stable_choice = 6;
  }
  oneof all_draft {
    Draft first = 7;
    Draft.Nested second = 8;
  }
  Draft.Nested nested = 9;
  Draft.State state = 10;
  Draft.Extra extra = 11 [(temporal.api.protometa.v1.draft) = "feature-c"];
  StableChild stable_child = 12;
  repeated Draft.State states = 13;
  map<string, Draft.State> state_by_name = 14;
}
message Empty { Draft draft = 1; }
message CycleA { CycleB child = 1; }
message CycleB { CycleA next = 1; Draft draft = 2; }
