syntax = "proto3";
package fixture;

import "google/protobuf/descriptor.proto";
import "temporal/api_next/protometa/v1/draft.proto";

enum Mode {
  STABLE = 0;
  PREVIEW = 1 [(temporal.api.protometa.v1.draft_enum_value) = "preview"];
}

message Labels {
  repeated Mode modes = 1;
  string preview = 2 [(temporal.api.protometa.v1.draft) = "preview"];
}

extend google.protobuf.MessageOptions {
  Mode mode = 50000;
  Labels labels = 50001;
}

message Stored {
  option (mode) = STABLE;
  option (labels) = { modes: [STABLE] };
}

message Preview {
  option (temporal.api.protometa.v1.draft_message) = "preview";
  option (mode) = PREVIEW;
  option (labels) = { modes: [STABLE, PREVIEW], preview: "on" };
}
