syntax = "proto3";

package fixture;

import "temporal/api_next/protometa/v1/draft.proto";

// Stable doc.
message Keeper {
  string a = 1; // trailing a
  string b = 2 [(temporal.api.protometa.v1.draft) = "b"]; // DRAFT same-line trailing b
  // DRAFT leading c
  string c = 3 [(temporal.api.protometa.v1.draft) = "c"];
  // DRAFT wrapped leading doc of f,
  // DRAFT continued on a second line.
  string f = 4 [(temporal.api.protometa.v1.draft) = "f"];

  // leading d
  string   d=5 ;
  Thing t = 6; /* DRAFT block trailing t */
  string e = 7 [
    // DRAFT inside options
    (temporal.api.protometa.v1.draft) = "e" /* DRAFT inside options block */
  ];
  /* DRAFT block leading g
   * continued */
  string g = 8 [(temporal.api.protometa.v1.draft) = "g"];
  // leading h shares the word DRAFT
  string h = 9;
}

// DRAFT leading comment of draft message.
message Thing {
  option (temporal.api.protometa.v1.draft_message) = "thing";
  // DRAFT nested leading
  string v = 1; // DRAFT nested trailing
} // DRAFT trailing on draft message close

message Flat { string x = 1; }
