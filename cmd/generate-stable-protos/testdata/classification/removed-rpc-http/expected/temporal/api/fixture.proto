syntax = "proto3";
package fixture;

// The marker uses the empty message.
import "google/protobuf/empty.proto";

// Item holds the request data.
message Item {
  google.protobuf.Empty marker = 2;
}

message OtherRequest {}
message OtherResponse {}
service Service {
  rpc Stable(OtherRequest) returns (OtherResponse);
}
