syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/annotations.proto";
import "temporal/api_next/protometa/v1/draft.proto";
message Request { option (temporal.api.protometa.v1.draft_message) = "preview"; Item item = 1; }
message Item {
  string id = 1;
  string draft_id = 2 [(temporal.api.protometa.v1.draft) = "feature-a"];
}
message Response { option (temporal.api.protometa.v1.draft_message) = "preview"; }
service Service {
  option (temporal.api.protometa.v1.draft_service) = "preview";
  rpc Call (Request) returns (Response) {
    option (temporal.api.protometa.v1.request_header) = { header: "item-kind" value: "item" };
    option (temporal.api.protometa.v1.request_header) = {
      header: "item-id"
      value: "{item.id}/{item.draft_id}"
    };
  }
}
