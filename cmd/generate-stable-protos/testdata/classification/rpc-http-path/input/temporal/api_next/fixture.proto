syntax = "proto3";
package fixture;
import "google/api/annotations.proto";
import "temporal/api_next/protometa/v1/draft.proto";
message Request { string draft_id = 1 [(temporal.api.protometa.v1.draft) = "feature-a"]; }
message Response {}
message PreviewRequest {
  option (temporal.api.protometa.v1.draft_message) = "preview";
}
message PreviewResponse {
  option (temporal.api.protometa.v1.draft_message) = "preview";
}
service Service {
  rpc Preview (PreviewRequest) returns (PreviewResponse) {
    option (temporal.api.protometa.v1.draft_method) = "preview";
  }
  rpc Call (Request) returns (Response) {
    option (google.api.http) = { get: "/items/{draft_id=items/*}" };
  }
}
