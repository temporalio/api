syntax = "proto3";
package fixture;
import "temporal/api_next/protometa/v1/draft.proto";

// Draft carries preview data.
message Draft { option (temporal.api.protometa.v1.draft_message) = "preview"; }
message Choice {
  // selection selects a preview target.
  oneof selection {
    option (temporal.api.protometa.v1.draft_oneof) = "preview";
    // target selects a structured target.
    Draft target = 1;
    string alias = 2;
  } // This oneof is preview-only.
  // key selects a stable target.
  oneof key {
    string id = 3;
    // draft_key selects a preview key.
    string draft_key = 4 [(temporal.api.protometa.v1.draft) = "preview"];
  }
  optional bool enabled = 5;
}
