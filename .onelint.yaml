version: 1

format:
  # Existing .proto files use 4-space indentation; turn on once formatted.
  buf-format: off

lint:
  actionlint: on
  api-linter:
    command: api-linter
    files:
      - "temporal/**/*.proto"
    check: ["--set-exit-status", "-I=.", "--config=api-linter.yaml"]
  buf-lint: on
