version: 1

profiles:
  testx: off

go-modules:
  - cmd/protoc-gen-nexus-rpc-yaml
  - cmd/protoc-gen-resource-id-lint
  - cmd/protoc-gen-system-nexus-wit

format:
  # Existing .proto files use 4-space indentation; turn on once formatted.
  buf-format: off
  gci: off
  gofmt: off
  gofumpt: off

lint:
  actionlint: on
  api-linter:
    command: api-linter
    files:
      - "temporal/**/*.proto"
    check: ["--set-exit-status", "-I=.", "--config=api-linter.yaml"]
  buf-lint: on
  gofix: off
  golangci-lint: off
  gomodtidy: on
